#No importa el orden
#Especificar el String de la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pa2_u2

#Tipo de base de datos
quarkus.datasource.db-kind=postgresql

#Usuario
quarkus.datasource.username=postgres

#Contraseña -> probar porque en las de la U es labcom,2015
quarkus.datasource.password=postgres

#Mostrar las sentencias sql en consola
quarkus.hibernate-orm.log.sql=true

#Gestion de la base de datos
# con update sincroniza los cambios
quarkus.hibernate-orm.database.generation=update